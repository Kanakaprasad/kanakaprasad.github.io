                        <h4>Email</h4>

                <a href="https://linkedin.com/in/kanakaprasad-sd" target="_blank" class="contact-card-modern">

                <a href="https://github.com/Kanakaprasad" target="_blank" class="contact-card-modern">

        <!-- Contact Form -->
        <div class="contact-form-panel">
            <form id="contactForm" action="https://formspree.io/f/xdkdanwe" method="POST" class="modern-form">
                <input type="text" name="_gotcha" style="display:none">
                
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your Full Name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Your Email Address" required>
                </div>
                
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" placeholder="Subject" required>
                </div>
                
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Your message..." required></textarea>
                </div>
                
                <button type="submit" class="btn submit-btn">
                    <span>Send Message</span>
                    <i class="fas fa-paper-plane"></i>
                </button>
            </form>
        </div>
